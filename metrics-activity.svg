                                    </svg>
                                    <div class="content">
                                        Commented on
                                        <span class="issue">#527 Feature: Gateway Permission Tiers — Role-Based Access Control (Owner/Admin/User/Guest) for Messenger Platforms</span>
                                    </div>
                                </div>
                                <div class="details">
                                    <div>opened by teknium1 in <span class="repo">NousResearch/hermes-agent</span></div>
                                    <div class="comment">
                                        +1 — sharing a concrete team use case in case it helps shape the design.
Scenario: DevOps team assistant in Telegram

Bot lives in an engineering Telegram group
Developers ask the bot for read-only diagnostics: pod status, tail logs, query metrics, investigate alerts
Ops engineers need to approve any state-changing operation:
                                        <code>systemctl restart</code>
                                        ,
                                        <code>kubectl scale</code>
                                        , deployments, DB writes

Where the current binary model breaks down
To let developers chat with the bot, we must add them to
                                        <code>allowed_chats</code>
                                        . Once in, they can click the inline approval button on their own requests — there's nothing at the protocol level distinguishing "requester" from "approver." The approval workflow ends up decorative, not enforcing.
Workarounds we've considered, all with significant downsides:

Two bot instances (read-only dev bot + privileged ops bot) — works, but doubles ops overhead and breaks the "one assistant" UX
CLI-only approval — secure, but kills the mobile UX that made the Telegram integration valuable in the first place
OS-level sudoers allowlist — necessary regardless, but solves "what can run" not "who can authorize"

What would unblock us from this proposal
The minimal cut that solves the use case:

User — can DM/mention bot, trigger any tool, but execution is gated on approval
Admin — can approve User-initiated tool calls; cannot approve requests they themselves initiated
Owner — full access (CLI host)

The "cannot approve own" semantic is the critical bit. Even within a single tier, requester ≠ approver must be enforceable, otherwise the whole system collapses to "any authorized user can do anything."
Narrower interim option (if full RBAC is too large a change to ship soon)
A config flag like
                                        <code>approvals.require_separate_approver: true</code>
                                        that rejects approval clicks from the same
                                        <code>user_id</code>
                                        that initiated the request. This is a much smaller surface area than full role tiers and could land independently.
Related: #16475 (pluggable approval hooks) could implement this entirely in userland if the hook receives both
                                        <code>requester_id</code>
                                        and
                                        <code>approver_id</code>
                                        — that combination might be the lowest-effort path to unblock this class of use cases without committing to a full RBAC model upfront.
Happy to test any prototype against our real workflow.
                                    </div>
                                </div>
                            </section>
                        </div>
                    </section>
                </div>
            </section>
